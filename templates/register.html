<section class="card auth-card">
  <h1>Create a student account</h1>
  <p class="muted">Teacher accounts are created by the administrator on the server.</p>
  {{{alert}}}
  <form method="post" action="/register">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{username}}" autocomplete="username"
           pattern="[a-z0-9_]{3,32}" maxlength="32" required autofocus>
    <p class="hint">{{username_rules}}</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="6" maxlength="128" required>
    <p class="hint">{{password_rules}}</p>
    <label for="confirm">Repeat password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password"
           minlength="6" maxlength="128" required>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Log in</a>.</p>
</section>
